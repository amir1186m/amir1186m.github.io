</div>

<script>

const API_URL =
    "https://shayli-prices.amir-sepahan1390.workers.dev";


const form =
    document.getElementById("registerForm");

const nameInput =
    document.getElementById("name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");

const showPasswordButton =
    document.getElementById("showPassword");


/* ==========================
   SHOW MESSAGE
========================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message show " + type;
}


/* ==========================
   PASSWORD VISIBILITY
========================== */

showPasswordButton.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type === "password"
        ) {

            passwordInput.type = "text";

            showPasswordButton.textContent =
                "🙈";

        } else {

            passwordInput.type = "password";

            showPasswordButton.textContent =
                "👁️";
        }
    }
);


/* ==========================
   REGISTER
========================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        const name =
            nameInput.value.trim();

        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if (name.length < 2) {

            showMessage(
                "لطفاً نام و نام خانوادگی را وارد کنید.",
                "error"
            );

            nameInput.focus();

            return;
        }


        if (password.length < 8) {

            showMessage(
                "رمز عبور باید حداقل ۸ کاراکتر باشد.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        registerButton.disabled = true;

        registerButton.textContent =
            "در حال ساخت حساب...";


        showMessage(
            "در حال ایجاد حساب کاربری...",
            "success"
        );


        try {

            const response =
                await fetch(
                    API_URL + "/api/register",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        /*
                         * مهم:
                         * اینجا credentials نداریم.
                         * چون Worker فعلی از CORS *
                         * استفاده می‌کند.
                         */

                        body: JSON.stringify({
                            name: name,
                            email: email,
                            password: password
                        })
                    }
                );


            let data;

            try {

                data =
                    await response.json();

            } catch {

                data = {};
            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "ثبت‌نام انجام نشد."
                );
            }


            showMessage(
                "✅ حساب شما با موفقیت ساخته شد!",
                "success"
            );


            registerButton.textContent =
                "حساب ساخته شد ✓";


            /*
             * چون فعلاً درخواست بدون credentials است،
             * کوکی cross-origin برای ورود خودکار
             * قابل اتکا نیست.
             *
             * بنابراین بعد از ثبت‌نام،
             * کاربر را به صفحه ورود می‌فرستیم.
             */

            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                1200
            );


        } catch (error) {

            console.error(
                "REGISTER ERROR:",
                error
            );


            let text =
                error.message ||
                "خطا در ارتباط با سرور.";


            if (
                error instanceof TypeError
            ) {

                text =
                    "ارتباط با سرور برقرار نشد. اتصال اینترنت و تنظیمات CORS را بررسی کنید.";
            }


            showMessage(
                text,
                "error"
            );


            registerButton.disabled =
                false;

            registerButton.textContent =
                "ساخت حساب";
        }

    }
);

</script>
