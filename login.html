</div>

<script>

const API_URL =
    "https://shayli-prices.amir-sepahan1390.workers.dev";


const form =
    document.getElementById(
        "loginForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


const showPasswordButton =
    document.getElementById(
        "showPassword"
    );


/* ==========================
   MESSAGE
========================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message show " +
        type;
}


/* ==========================
   SHOW PASSWORD
========================== */

showPasswordButton.addEventListener(
    "click",
    function () {

        if (
            passwordInput.type ===
            "password"
        ) {

            passwordInput.type =
                "text";

            showPasswordButton.textContent =
                "🙈";

        } else {

            passwordInput.type =
                "password";

            showPasswordButton.textContent =
                "👁️";
        }

    }
);


/* ==========================
   LOGIN
========================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        if (!email) {

            showMessage(
                "لطفاً ایمیل خود را وارد کنید.",
                "error"
            );

            emailInput.focus();

            return;
        }


        if (
            password.length < 8
        ) {

            showMessage(
                "رمز عبور باید حداقل ۸ کاراکتر باشد.",
                "error"
            );

            passwordInput.focus();

            return;
        }


        loginButton.disabled =
            true;


        loginButton.textContent =
            "در حال ورود...";


        showMessage(
            "در حال بررسی اطلاعات...",
            "success"
        );


        try {

            const response =
                await fetch(
                    API_URL +
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            let data = {};

            try {

                data =
                    await response.json();

            } catch {

                data = {};

            }


            if (
                !response.ok
            ) {

                throw new Error(
                    data.error ||
                    "ایمیل یا رمز عبور اشتباه است."
                );
            }


            if (
                data.success
            ) {

                showMessage(
                    "✅ ورود موفق بود! در حال ورود به حساب...",
                    "success"
                );

                loginButton.textContent =
                    "ورود موفق ✓";


                /*
                 * فعلاً کاربر را به پنل
                 * حساب هدایت می‌کنیم.
                 */

                setTimeout(
                    function () {

                        window.location.href =
                            "account.html";

                    },
                    900
                );

            } else {

                throw new Error(
                    "ورود انجام نشد."
                );
            }


        } catch (error) {

            console.error(
                "LOGIN ERROR:",
                error
            );


            showMessage(
                error.message ||
                "خطا در ارتباط با سرور.",
                "error"
            );


            loginButton.disabled =
                false;


            loginButton.textContent =
                "ورود به حساب";

        }

    }
);

</script>
